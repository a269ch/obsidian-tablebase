name: Release Plugin

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Obsidian Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Type Check & Tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Build plugin production bundle
        run: npm run build

      - name: Package plugin zip archive
        run: |
          mkdir -p dist/tablebase
          cp main.js manifest.json styles.css dist/tablebase/
          cd dist
          zip -r tablebase.zip tablebase
          cd ..

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            dist/tablebase.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
